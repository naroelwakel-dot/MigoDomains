<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب - Migo Domains</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>

  <header class="masthead">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="dot" aria-hidden="true"></span> Migo Domains</a>
      <button class="nav-toggle" data-nav-toggle="#main-nav" aria-expanded="false" aria-controls="main-nav" aria-label="القائمة">&#9776;</button>
      <nav class="nav" id="main-nav" aria-label="التنقل الرئيسي">
        <a href="index.html">الرئيسية</a>
        <a href="search.html">البحث عن دومين</a>
        <a href="login.html">تسجيل الدخول</a>
        <button class="btn btn-sm" data-dir-toggle type="button" aria-pressed="false">EN / LTR</button>
      </nav>
    </div>
  </header>

  <main id="main" class="section">
    <div class="wrap">
      <form class="card" id="signup-form" novalidate style="max-width:520px;margin:0 auto">
        <h1 class="h2">إنشاء حساب</h1>
        <p class="muted mt-2" style="font-size:var(--fs-sm)">خطوة واحدة وتقدر تبحث وتحجز الدومينات باسمك.</p>

        <div class="grid grid-2 mt-5">
          <div class="field">
            <label for="fname">الاسم بالكامل</label>
            <input class="input" id="fname" autocomplete="name">
          </div>
          <div class="field">
            <label for="phone">رقم الهاتف (اختياري)</label>
            <input class="input" id="phone" type="tel" autocomplete="tel" placeholder="+20 ...">
          </div>
        </div>

        <div class="field mt-4">
          <label for="email">البريد الإلكتروني</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        </div>

        <div class="field mt-4">
          <label for="password">كلمة السر</label>
          <input class="input" id="password" type="password" autocomplete="new-password" required>
          <span class="hint mt-2">8 أحرف على الأقل.</span>
        </div>

        <label class="row mt-4" style="gap:var(--s2);align-items:flex-start">
          <input type="checkbox" id="agree">
          <span class="muted" style="font-size:var(--fs-sm)">أوافق على شروط الخدمة وسياسة الخصوصية.</span>
        </label>

        <button class="btn btn-primary mt-5" type="submit" style="width:100%">إنشاء الحساب</button>
        <p class="dim mt-3" style="font-size:var(--fs-xs)">ممكن نطلب تأكيد البريد قبل تفعيل الحساب حسب إعدادات المشروع.</p>
        <div id="msg" class="mt-4" role="status" aria-live="polite" hidden></div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap row-between wrap-flex">
      <p>Migo Domains - منتج من Migo AI Solution.</p>
      <p class="row"><a href="login.html">تسجيل الدخول</a><span class="dim">&copy; <span data-year>2026</span></span></p>
    </div>
  </footer>

  <div class="scrim" data-dismiss></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById("signup-form");
      var msg = document.getElementById("msg");

      function say(text, kind) { msg.hidden = false; msg.className = "mt-4 pill " + (kind || "info"); msg.textContent = text; }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var fname = document.getElementById("fname").value.trim();
        var phone = document.getElementById("phone").value.trim();

        if (!email) { say("اكتب البريد الإلكتروني", "warn"); return; }
        if (password.length < 8) { say("كلمة السر لازم 8 أحرف على الأقل", "warn"); return; }
        if (!document.getElementById("agree").checked) { say("لازم توافق على الشروط", "warn"); return; }

        if (!window.MigoAuth || !window.MigoAuth.isConfigured()) {
          say("خدمة الدخول غير مُهيّأة بعد - محتاجة رابط المشروع والمفتاح العام", "warn");
          return;
        }

        window.MigoAuth.signUp(email, password, { full_name: fname, phone: phone }).then(function (d) {
          if (d && d.access_token) { location.href = "account.html"; return; }
          say("تم إنشاء الحساب - راجع بريدك لتأكيد الحساب", "ok");
        }).catch(function (err) { say(err.message, "danger"); });
      });
    })();
  </script>
</body>
</html>
