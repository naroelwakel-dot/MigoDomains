<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استعادة كلمة السر - Migo Domains</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>

  <header class="masthead">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="dot" aria-hidden="true"></span> Migo Domains</a>
      <button class="nav-toggle" data-nav-toggle="#main-nav" aria-expanded="false" aria-controls="main-nav" aria-label="القائمة">&#9776;</button>
      <nav class="nav" id="main-nav" aria-label="التنقل الرئيسي">
        <a href="index.html">الرئيسية</a>
        <a href="search.html">البحث عن دومين</a>
        <a href="login.html">تسجيل الدخول</a>
        <button class="btn btn-sm" data-dir-toggle type="button" aria-pressed="false">EN / LTR</button>
      </nav>
    </div>
  </header>

  <main id="main" class="section">
    <div class="wrap">
      <form class="card" id="forgot-form" novalidate style="max-width:480px;margin:0 auto">
        <h1 class="h2">استعادة كلمة السر</h1>
        <p class="muted mt-2" style="font-size:var(--fs-sm)">اكتب بريدك ونبعتلك رابط لتعيين كلمة سر جديدة.</p>

        <div class="field mt-5">
          <label for="email">البريد الإلكتروني</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        </div>

        <button class="btn btn-primary mt-5" type="submit" style="width:100%">أرسل الرابط</button>
        <p class="mt-4" style="font-size:var(--fs-sm)"><a href="login.html">رجوع لتسجيل الدخول</a></p>
        <div id="msg" class="mt-4" role="status" aria-live="polite" hidden></div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap row-between wrap-flex">
      <p>Migo Domains - منتج من Migo AI Solution.</p>
      <p class="row"><a href="support.html">الدعم</a><span class="dim">&copy; <span data-year>2026</span></span></p>
    </div>
  </footer>

  <div class="scrim" data-dismiss></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById("forgot-form");
      var msg = document.getElementById("msg");

      function say(text, kind) { msg.hidden = false; msg.className = "mt-4 pill " + (kind || "info"); msg.textContent = text; }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        if (!email) { say("اكتب البريد الإلكتروني", "warn"); return; }

        if (!window.MigoAuth || !window.MigoAuth.isConfigured()) {
          say("خدمة الدخول غير مُهيّأة بعد - محتاجة رابط المشروع والمفتاح العام", "warn");
          return;
        }

        window.MigoAuth.resetPassword(email).then(function () {
          say("لو البريد ده مسجّل عندنا، هيوصلك رابط إعادة التعيين", "ok");
        }).catch(function (err) { say(err.message, "danger"); });
      });
    })();
  </script>
</body>
</html>
